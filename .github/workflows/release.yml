name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build zip release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: docker compose build dev
      - run: docker compose run --rm dev python3 -m ruff check .
      - run: docker compose run --rm dev python3 -m ruff format . --check
      - run: docker compose run --rm dev python3 -m mypy custom_components/deyecloud
      - run: docker compose run --rm dev python3 -m pytest
      - run: docker compose run --rm dev python3 scripts/generate_brand_assets.py
      - name: Extract version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Stage release notes
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes="RELEASE_NOTES_v${VERSION}.md"
          {
            if [[ -f "$notes" ]]; then
              cat "$notes"
            else
              echo "::warning::${notes} is not in this tag; publishing without notes"
              echo "See the commit log for v${VERSION}."
            fi
          } > "${RUNNER_TEMP}/release_body.md"
      - name: Build zip
        run: bash ./scripts/build_zip "${{ steps.version.outputs.version }}"
      - name: Upload release asset
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/deyecloud-${{ steps.version.outputs.version }}.zip
          body_path: ${{ runner.temp }}/release_body.md
